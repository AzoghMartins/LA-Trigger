name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          cd build/LATrigger_artefacts/Release
          tar czf ../../../LA-Trigger-linux-x86_64.tar.gz VST3/LA-Trigger.vst3 LV2/LA-Trigger.lv2 Standalone/LA-Trigger

      - uses: actions/upload-artifact@v4
        with:
          name: LA-Trigger-linux-x86_64
          path: LA-Trigger-linux-x86_64.tar.gz
